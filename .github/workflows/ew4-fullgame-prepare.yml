name: Prepare complete EW4 game text and Android engine
on:
  push:
    branches: [ew4-fullgame]
    paths: ['ew4-online/fullgame/translate_ru.py', 'ew4-online/fullgame/translation-input.json', '.github/workflows/ew4-fullgame-prepare.yml']
permissions:
  contents: write
jobs:
  translation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Translate the complete public game text
        run: python ew4-online/fullgame/translate_ru.py --input ew4-online/fullgame/translation-input.json --output ew4-online/fullgame/translated-ru.json
      - name: Publish reviewable translation files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "ew4-russian-text-${GITHUB_SHA::8}" ew4-online/fullgame/translated-ru.json ew4-online/fullgame/translation-coverage.json --target "$GITHUB_SHA" --prerelease --latest=false --title 'EW4 complete Russian text for review - not a game build' --notes 'Public game text only. Machine translated draft; the game interface has reviewed overrides. No user files or crash logs.'
