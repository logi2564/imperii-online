name: EW4 complete offline Windows and Android game
on:
  push:
    branches: [ew4-fullgame]
    paths: ['ew4-online/**', '.github/workflows/ew4-fullgame.yml']
  workflow_dispatch:
concurrency:
  group: ew4-full-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the complete game engine and bundled Android resources
        run: |
          dotnet workload install android --version 10.0.100
          git clone --depth 1 --branch v0.2.19-20261024 https://github.com/aztksilence111/ew4-rewrite.git .work/engine
          python ew4-online/fullgame/apply_fullgame.py .work/engine
          npm --prefix .work/engine/tools/frontend ci --no-audit --no-fund
          python ew4-online/fullgame/build_android.py --upstream .work/engine --output build/android
      - name: Keep the diagnostic APK available for repeating a failed emulator check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ew4-diagnostic-apk
          path: build/android/EuropeanWar4-Full-Android-test.apk
          if-no-files-found: ignore
      - name: Prepare the real PC host and verification tools
        run: |
          dotnet build .work/engine/rewrite/Ew4.Web -c Release
          dotnet publish .work/engine/rewrite/Ew4.Web -c Release -r linux-x64 --self-contained true -o build/game/server -p:DebugType=None -p:DebugSymbols=false
          npm --prefix ew4-online/desktop ci --no-audit --no-fund
          node ew4-online/desktop/node_modules/electron/install.js
          curl --fail --location https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64 -o build/game/cloudflared
          python -c "import hashlib,json;from pathlib import Path;assert hashlib.sha256(Path('build/game/cloudflared').read_bytes()).hexdigest()==json.loads(Path('ew4-online/UPSTREAM.json').read_text())['cloudflared_linux_sha256']"
          chmod +x build/game/cloudflared
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Enable the Android test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play the installed Android game without network, restart its save, then play online with PC
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python ew4-online/tests/full_android.py --apk build/android/EuropeanWar4-Full-Android-test.apk --output build/offline-checks
            xvfb-run -a python ew4-online/tests/android_crossplay.py --full --electron ew4-online/desktop/node_modules/electron/dist/electron --app ew4-online/desktop --root build/game --apk build/android/EuropeanWar4-Full-Android-test.apk --output build/app-checks
      - name: Verify authoritative multiplayer ownership and durable saves
        run: python ew4-online/tests/integration.py --upstream .work/engine --output build/core-checks
      - name: Publish only controlled failure status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data={}
          for path in ['build/android/android-compile-status.json','build/offline-checks/full-android.json','build/app-checks/android-crossplay.json']:
              p=Path(path)
              if p.exists(): data[p.name]=json.loads(p.read_text())
          Path('full-android-status.json').write_text(json.dumps(data or {'result':'FAIL','stage':'build_or_test_environment'},indent=2)+'\n')
          PY
          gh release create "ew4-full-diagnostics-${GITHUB_SHA::8}" full-android-status.json --target "$GITHUB_SHA" --prerelease --latest=false --title 'EW4 full Android verification status - not a game release' --notes 'Fixed stages, error classes, compiler codes and test results only. No logs, paths, invitations, dumps or profiles.'
      - uses: actions/upload-artifact@v4
        with:
          name: ew4-full-android
          path: |
            build/android/EuropeanWar4-Full-Android.apk
            build/android/EuropeanWar4-Full-Android.apk.sha256
            build/android/android-build-info.json
            build/offline-checks/full-android.json
            build/offline-checks/android-full-main.png
            build/offline-checks/android-full-campaigns.png
            build/offline-checks/android-offline-battle.png
            build/app-checks/android-crossplay.json
            build/app-checks/android-battle.png
            build/app-checks/desktop-multiplayer.png
            build/core-checks/integration.json
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and package the full software-rendered Windows game
        shell: bash
        run: |
          git clone --depth 1 --branch v0.2.19-20261024 https://github.com/aztksilence111/ew4-rewrite.git .work/engine
          python ew4-online/fullgame/apply_fullgame.py .work/engine
          npm --prefix .work/engine/tools/frontend ci --no-audit --no-fund
          dotnet publish .work/engine/rewrite/Ew4.Web -c Release -r win-x64 --self-contained true -o build/EuropeanWar4-Napoleon/server -p:DebugType=None -p:DebugSymbols=false
          npm --prefix ew4-online/desktop ci --no-audit --no-fund
          node ew4-online/desktop/node_modules/electron/install.js
          curl --fail --location https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-windows-amd64.exe -o build/EuropeanWar4-Napoleon/cloudflared.exe
          python -c "import hashlib,json;from pathlib import Path;assert hashlib.sha256(Path('build/EuropeanWar4-Napoleon/cloudflared.exe').read_bytes()).hexdigest()==json.loads(Path('ew4-online/UPSTREAM.json').read_text())['cloudflared_windows_sha256']"
          curl --fail --location https://raw.githubusercontent.com/cloudflare/cloudflared/2026.10.3/LICENSE -o build/EuropeanWar4-Napoleon/Cloudflared-LICENSE.txt
          python ew4-online/desktop/package_game.py --electron ew4-online/desktop/node_modules/electron/dist --root build/EuropeanWar4-Napoleon --output build/EuropeanWar4-Full-Windows.zip
          python -m pip install playwright==1.62.0
      - name: Play a real campaign, move, save, measure drawing and restart into the menu
        run: python ew4-online/tests/full_desktop.py --electron build/EuropeanWar4-Napoleon/EuropeanWar4-Napoleon.exe --app build/EuropeanWar4-Napoleon/resources/app --root build/EuropeanWar4-Napoleon --output build/windows-checks
      - name: Publish controlled Windows verification status
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f build/windows-checks/full-desktop.json ]; then mkdir -p build/windows-checks; echo '{"result":"FAIL","stage":"windows_build"}' > build/windows-checks/full-desktop.json; fi
          gh release create "ew4-full-windows-status-${GITHUB_SHA::8}" build/windows-checks/full-desktop.json --target "$GITHUB_SHA" --prerelease --latest=false --title 'EW4 full Windows verification status - not a game release' --notes 'Controlled stages and result fields only; no logs, profiles, dumps or invitations.'
      - uses: actions/upload-artifact@v4
        with:
          name: ew4-full-windows
          path: |
            build/EuropeanWar4-Full-Windows.zip
            build/EuropeanWar4-Full-Windows.zip.sha256
            build/native-build-info.json
            build/windows-checks/full-desktop.json
            build/windows-checks/full-main.png
            build/windows-checks/full-headquarters.png
            build/windows-checks/full-campaigns.png
            build/windows-checks/full-campaign-battle.png
            build/EuropeanWar4-Napoleon/READ-ME.txt
          if-no-files-found: error
  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ew4-full-windows
          path: build/windows
      - uses: actions/download-artifact@v4
        with:
          name: ew4-full-android
          path: build/android
      - name: Publish the complete verified games
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ew4-full-v0.3.1-${GITHUB_SHA::8}" build/windows/EuropeanWar4-Full-Windows.zip build/windows/EuropeanWar4-Full-Windows.zip.sha256 build/windows/native-build-info.json build/windows/windows-checks/full-desktop.json build/windows/windows-checks/full-main.png build/windows/windows-checks/full-campaigns.png build/windows/windows-checks/full-campaign-battle.png build/android/android/EuropeanWar4-Full-Android.apk build/android/android/EuropeanWar4-Full-Android.apk.sha256 build/android/android/android-build-info.json build/android/offline-checks/full-android.json build/android/offline-checks/android-full-main.png build/android/offline-checks/android-full-campaigns.png build/android/offline-checks/android-offline-battle.png build/android/app-checks/android-crossplay.json build/android/app-checks/android-battle.png build/android/core-checks/integration.json build/windows/EuropeanWar4-Napoleon/READ-ME.txt --target "$GITHUB_SHA" --prerelease --latest=false --title 'Европейская война 4 — полная автономная игра для Windows и Android' --notes-file ew4-online/NATIVE-READ-ME.txt
