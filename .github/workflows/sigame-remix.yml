name: Build the familiar-games and unique-anime SIGame remix
on:
  push:
    branches: [sigame-friends-pack]
    paths:
      - 'sigame-packs/friends-remix/**'
      - 'sigame-packs/tools/compose_remix.py'
      - 'sigame-packs/tools/validate_remix_content.py'
      - '.github/workflows/sigame-remix.yml'
permissions:
  contents: write
jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Install offline media verification tools
        run: |
          python -m pip install pillow==11.3.0 lxml==6.0.2
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify franchise balance and no anime repetitions
        run: python sigame-packs/tools/validate_remix_content.py > content-check.json
      - name: Build and validate the exact playable archive
        run: |
          python sigame-packs/tools/build_pack.py --pack sigame-packs/friends-remix --output dist/sigame-remix
          python sigame-packs/tools/validate_pack.py dist/sigame-remix/Bro-Pack-140-Remix.siq --pack sigame-packs/friends-remix
          dotnet run --project sigame-packs/tools/OfficialLoader --configuration Release -- dist/sigame-remix/Bro-Pack-140-Remix.siq dist/sigame-remix/build-info.json | tee dist/sigame-remix/official-import.txt
      - name: Publish the verified remix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "sigame-bro-remix-140-${GITHUB_SHA::8}" dist/sigame-remix/Bro-Pack-140-Remix.siq dist/sigame-remix/Bro-Pack-140-Remix.siq.sha256 dist/sigame-remix/How-to-play.txt dist/sigame-remix/validation.json dist/sigame-remix/official-import.txt content-check.json --target "$GITHUB_SHA" --prerelease --latest=false --title 'БРО-ПАК — 140 вопросов: знакомые игры, JoJo и персонаживотные' --notes-file sigame-packs/friends-remix/HOW-TO-PLAY.txt
