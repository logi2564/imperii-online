name: Gutsy Geoid Russian localization
on:
  push:
    branches: [warcraft-gutsy-russian]
    paths:
      - 'warcraft-maps/gutsy-ru/**'
      - '.github/workflows/warcraft-gutsy-russian.yml'
permissions:
  contents: write
concurrency:
  group: gutsy-russian
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install gdown==5.2.0
      - run: python warcraft-maps/gutsy-ru/tools/fetch_source.py source-out
      - name: Source snapshot for localization tooling
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="gutsy-source-${GITHUB_SHA:0:8}"
          gh release create "$tag" source-out/Gutsy-Geoid-EN-1.0.5.w3x source-out/Source.json --target "$GITHUB_SHA" --prerelease --latest=false --title 'Gutsy Geoid EN 1.0.5 — source snapshot for localization' --notes 'Source input only. Russian localization is being prepared.'
