name: Build and audit full Gutsy Geoid Russian localization
on:
  push:
    branches: [warcraft-gutsy-russian]
    paths:
      - 'warcraft-maps/gutsy-ru/**'
      - '.github/workflows/warcraft-gutsy-russian.yml'
permissions:
  contents: write
concurrency:
  group: gutsy-russian
  cancel-in-progress: true
jobs:
  localize:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare exact source and offline validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ make
          mkdir -p work
          curl --fail --location --retry 2 'https://github.com/logi2564/imperii-online/releases/download/gutsy-source-6ac86d86/Gutsy-Geoid-EN-1.0.5.w3x' -o work/original.w3x
          git clone https://github.com/ladislav-zezula/StormLib.git "$RUNNER_TEMP/StormLib"
          git -C "$RUNNER_TEMP/StormLib" checkout 28c9b4be3f23c6b3a5ff55cacac7dbe5b9cdc4fc
          cmake -S "$RUNNER_TEMP/StormLib" -B "$RUNNER_TEMP/storm-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DSTORM_SKIP_INSTALL=ON -DSTORM_USE_BUNDLED_LIBRARIES=ON
          cmake --build "$RUNNER_TEMP/storm-build" --parallel 2
          printf 'STORMLIB_PATH=%s\n' "$RUNNER_TEMP/storm-build/libstorm.so" >> "$GITHUB_ENV"
          printf 'PYTHONFAULTHANDLER=1\n' >> "$GITHUB_ENV"
          git clone https://github.com/lep/pjass.git "$RUNNER_TEMP/pjass"
          git -C "$RUNNER_TEMP/pjass" checkout 654c3cf7731eb472518e6915e9d7672a72652165
          make -C "$RUNNER_TEMP/pjass"
      - name: Build the reviewed Russian text into the real map
        run: |
          set -euo pipefail
          python warcraft-maps/gutsy-ru/tools/catalog.py work/original.w3x work/catalog.json
          python warcraft-maps/gutsy-ru/tools/test_tokens.py work/catalog.json | tee work/Tokens-check.txt
          python warcraft-maps/gutsy-ru/tools/build.py work/original.w3x warcraft-maps/gutsy-ru/source/Translations.json work
      - name: Audit code, assets, audio, data and inherited compiler diagnostics
        run: |
          set -euo pipefail
          python warcraft-maps/gutsy-ru/tools/verify.py work/original.w3x work | tee work/Preservation-check.txt
          python warcraft-maps/gutsy-ru/tools/check_jass.py work/original.w3x work "$RUNNER_TEMP/pjass/pjass" warcraft-maps/gutsy-ru/tests/reference | tee work/Compiler-check.txt
          python warcraft-maps/gutsy-ru/tools/package.py work release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gutsy-russian-audit
          path: |
            work/*-check.txt
            work/*report.json
      - name: Publish the complete text localization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="gutsy-ru-${GITHUB_SHA:0:8}"
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'GGG RU FIX1 — совместимость текстов с Warcraft 1.26' --notes-file warcraft-maps/gutsy-ru/README-RU.txt
          printf 'В этой сборке подтверждён вылет при загрузке. Исправленная версия: https://github.com/%s/releases/tag/%s\n' "$GITHUB_REPOSITORY" "$tag" > obsolete-release.txt
          gh release edit gutsy-ru-378b23bc --title 'GGG RU — старая версия с вылетом на загрузке' --notes-file obsolete-release.txt --prerelease --latest=false
