name: Rexxar campaign repair checks (no release)
on:
  push:
    branches: [warcraft-rexxar-repair]
    paths:
      - 'warcraft-campaigns/rexxar-coop/**'
      - '.github/workflows/warcraft-rexxar-repair.yml'
permissions:
  contents: read
concurrency:
  group: rexxar-repair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: warcraft-campaigns/rexxar-coop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libstorm-dev fonts-dejavu-core
          python -m pip install lupa==2.8 Pillow==11.3.0
          git clone https://github.com/lep/pjass.git "$RUNNER_TEMP/pjass"
          git -C "$RUNNER_TEMP/pjass" checkout 654c3cf7731eb472518e6915e9d7672a72652165
          make -C "$RUNNER_TEMP/pjass"
          dotnet build coop/Tools -c Release --nologo
      - name: Audit every original mission's dialogue
        run: python coop/tests/test_trigger_strings.py
      - name: Build unpublished repair candidate
        run: python coop/unified_build.py --out build-out
      - name: Verify classic JASS and archive
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pjass/pjass" +shadow coop/tests/reference/common.j coop/tests/reference/Blizzard.j build-out/Rexxar-VII.j | tee build-out/JASS-check.txt
          dotnet coop/Tools/bin/Release/net10.0/Tools.dll atlas-verify build-out/Maps/Rexxar-VII-Coop-1.26.w3x | tee build-out/Independent-check.txt
          python coop/tests/test_unified_archive.py build-out | tee build-out/Archive-check.txt
      - name: Execute repair regressions and original campaign conditions
        run: |
          set -euo pipefail
          dotnet coop/Tools/bin/Release/net10.0/Tools.dll transpile build-out/Rexxar-VII.j coop/tests/reference build-out/Rexxar-VII.lua
          python -u coop/tests/test_unified.py build-out/Rexxar-VII.lua | tee build-out/Behavior-check.txt
          python -u coop/tests/test_campaign_integration.py build-out/Rexxar-VII.lua | tee build-out/Campaign-integration-check.txt
          python -u coop/tests/test_story_restore.py build-out/Rexxar-VII.lua | tee build-out/Story-restore-check.txt
          python -u coop/tests/test_talent_book.py build-out/Rexxar-VII.lua | tee build-out/Talent-book-check.txt
          python -u coop/tests/test_skill_regressions.py build-out/Rexxar-VII.lua | tee build-out/Skill-regression-check.txt
          python -u coop/tests/test_skill_demos.py build-out/Rexxar-VII.lua | tee build-out/Skill-demo-check.txt
          python -u coop/tests/test_world_restore.py build-out/Rexxar-VII.lua | tee build-out/World-restore-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rexxar-repair-check-logs
          path: |
            warcraft-campaigns/rexxar-coop/build-out/*-check.txt
            warcraft-campaigns/rexxar-coop/build-out/Build-report.json
