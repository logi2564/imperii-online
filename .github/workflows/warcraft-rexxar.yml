name: Build and test Rexxar four-slot patcher
on:
  push:
    branches: [warcraft-rexxar-coop]
    paths:
      - 'warcraft-campaigns/rexxar-coop/**'
      - '.github/workflows/warcraft-rexxar.yml'
concurrency:
  group: rexxar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  four-slots:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Test source export and four-slot map edits
        run: |
          $project = 'warcraft-campaigns/rexxar-coop/tools/ExportRexxar'
          dotnet run --project $project -- --self-test --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:REXXAR_TEST_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'rexxar-fixtures'
          dotnet run --project 'warcraft-campaigns/rexxar-coop/tools/FourSlots' -- --self-test --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project 'warcraft-campaigns/rexxar-coop/tools/VerifySlots' -- $env:REXXAR_TEST_ARTIFACTS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish and run the exact Windows executable
        run: |
          $project = 'warcraft-campaigns/rexxar-coop/tools/FourSlots'
          $out = 'warcraft-campaigns/rexxar-coop/release'
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:REXXAR_TEST_ARTIFACTS = Join-Path $env:RUNNER_TEMP 'rexxar-exe-fixtures'
          & "$out/Rexxar-4-Slots.exe" --self-test --no-pause | Tee-Object -FilePath "$out/Windows-exe-check.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project 'warcraft-campaigns/rexxar-coop/tools/VerifySlots' -- $env:REXXAR_TEST_ARTIFACTS | Tee-Object -FilePath "$out/Independent-map-check.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $source = Join-Path $env:REXXAR_TEST_ARTIFACTS 'slot-source.w3x'
          $result = Join-Path $env:RUNNER_TEMP 'rexxar-cli-output'
          $before = (Get-FileHash $source -Algorithm SHA256).Hash
          & "$out/Rexxar-4-Slots.exe" --map $source --out $result --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content (Join-Path $result 'Four-slots-report.json') -Raw | ConvertFrom-Json
          if ($report.mapsPatched -ne 1 -or $report.fullCoopImplemented -ne $false -or $report.maps[0].players.Count -ne 4) { throw 'Bad end-to-end CLI report' }
          if ($before -ne (Get-FileHash $source -Algorithm SHA256).Hash) { throw 'Source map modified' }
          if (!(Test-Path (Join-Path $result 'Rexxar-4-Slots/slot-source-4Slots.w3x'))) { throw 'Output map missing' }
          'PASS: exact Windows EXE, command-line map processing, four reported players, new output map and unchanged source SHA-256.' | Add-Content "$out/Windows-exe-check.txt"
          $game = Join-Path $env:REXXAR_TEST_ARTIFACTS 'game'
          $campaignResult = Join-Path $env:RUNNER_TEMP 'rexxar-game-output'
          $archiveBefore = (Get-FileHash (Join-Path $game 'War3x.mpq') -Algorithm SHA256).Hash
          & "$out/Rexxar-4-Slots.exe" --game $game --out $campaignResult --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $campaignReport = Get-Content (Join-Path $campaignResult 'Four-slots-report.json') -Raw | ConvertFrom-Json
          if ($campaignReport.mapsPatched -ne 17 -or $campaignReport.mapsFound -ne 17) { throw 'Full extraction-to-patching fixture path failed' }
          if ($archiveBefore -ne (Get-FileHash (Join-Path $game 'War3x.mpq') -Algorithm SHA256).Hash) { throw 'Source game archive modified' }
          'PASS: exact EXE exported 17 synthetic campaign missions and created all 17 four-slot maps, leaving the game archive unchanged.' | Add-Content "$out/Windows-exe-check.txt"
      - name: Prepare a download and checksum
        run: |
          $root = 'warcraft-campaigns/rexxar-coop'
          $out = "$root/release"
          Copy-Item "$root/FOUR-SLOTS-RU.txt" "$out/ЧИТАЙ.txt"
          $hash = (Get-FileHash "$out/Rexxar-4-Slots.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Rexxar-4-Slots.exe" | Set-Content "$out/Rexxar-4-Slots.exe.sha256" -Encoding utf8
          Compress-Archive -Path "$out/Rexxar-4-Slots.exe", "$out/ЧИТАЙ.txt", "$out/Windows-exe-check.txt", "$out/Independent-map-check.txt", "$out/Rexxar-4-Slots.exe.sha256" -DestinationPath "$out/Rexxar-4-Slots.zip"
      - name: Publish four-slot tool with explicit scope
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'rexxar-four-slots-' + $env:GITHUB_SHA.Substring(0, 8)
          gh release create $tag 'warcraft-campaigns/rexxar-coop/release/Rexxar-4-Slots.exe' 'warcraft-campaigns/rexxar-coop/release/Rexxar-4-Slots.zip' 'warcraft-campaigns/rexxar-coop/release/Rexxar-4-Slots.exe.sha256' 'warcraft-campaigns/rexxar-coop/release/Windows-exe-check.txt' 'warcraft-campaigns/rexxar-coop/release/Independent-map-check.txt' --target $env:GITHUB_SHA --prerelease --latest=false --title 'Рексар — четыре слота в лобби; сюжетный кооператив ещё не готов' --notes-file 'warcraft-campaigns/rexxar-coop/FOUR-SLOTS-RU.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
