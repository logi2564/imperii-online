name: Build and test Rexxar campaign source exporter
on:
  push:
    branches: [warcraft-rexxar-coop]
    paths:
      - 'warcraft-campaigns/rexxar-coop/**'
      - '.github/workflows/warcraft-rexxar.yml'
concurrency:
  group: rexxar-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  export-tool:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Build the source and exercise MPQ export rules
        run: |
          $project = 'warcraft-campaigns/rexxar-coop/tools/ExportRexxar'
          dotnet run --project $project -- --self-test --no-pause
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish and run the exact Windows executable
        run: |
          $project = 'warcraft-campaigns/rexxar-coop/tools/ExportRexxar'
          $out = 'warcraft-campaigns/rexxar-coop/release'
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$out/Export-Rexxar-Maps.exe" --self-test --no-pause | Tee-Object -FilePath "$out/Windows-exe-check.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare a download and checksum
        run: |
          $root = 'warcraft-campaigns/rexxar-coop'
          $out = "$root/release"
          Copy-Item "$root/README-RU.txt" "$out/README-RU.txt"
          $hash = (Get-FileHash "$out/Export-Rexxar-Maps.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Export-Rexxar-Maps.exe" | Set-Content "$out/Export-Rexxar-Maps.exe.sha256" -Encoding utf8
          Compress-Archive -Path "$out/Export-Rexxar-Maps.exe", "$out/README-RU.txt", "$out/Windows-exe-check.txt", "$out/Export-Rexxar-Maps.exe.sha256" -DestinationPath "$out/Export-Rexxar-Maps.zip"
      - name: Publish the source-export helper with explicit project status
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = 'rexxar-source-export-' + $env:GITHUB_SHA.Substring(0, 8)
          gh release create $tag 'warcraft-campaigns/rexxar-coop/release/Export-Rexxar-Maps.exe' 'warcraft-campaigns/rexxar-coop/release/Export-Rexxar-Maps.zip' 'warcraft-campaigns/rexxar-coop/release/Export-Rexxar-Maps.exe.sha256' 'warcraft-campaigns/rexxar-coop/release/Windows-exe-check.txt' --target $env:GITHUB_SHA --prerelease --latest=false --title 'Рексар — выгрузка исходных миссий для подготовки кооператива' --notes-file 'warcraft-campaigns/rexxar-coop/README-RU.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
