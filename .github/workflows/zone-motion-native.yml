name: Probe the actual Zone Motion native Windows player

on:
  push:
    branches: [zone-motion-pc]
    paths:
      - 'zone-motion-pc/native/**'
      - '.github/workflows/zone-motion-native.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zone-motion-native-probe
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Install the same game-data parser used in the local preparation
        run: python -m pip install UnityPy==1.25.4
      - uses: actions/cache/restore@v4
        id: inputs
        with:
          key: zone-native-verified-inputs-2017-2-0f3-electron45-v1
          path: |
            ${{ runner.temp }}/zone-native/*.apk
            ${{ runner.temp }}/zone-native/*.exe
            ${{ runner.temp }}/zone-native/*.zip
      - name: Prepare the native player candidate from verified source files
        shell: powershell
        run: |
          python zone-motion-pc/native/run_checked.py python -u zone-motion-pc/native/prepare_candidate.py --work "$env:RUNNER_TEMP\zone-native" --output "$env:GITHUB_WORKSPACE\dist\ZoneMotionPC"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python zone-motion-pc/native/run_checked.py python -u zone-motion-pc/native/prepare_renderer.py "$env:GITHUB_WORKSPACE\dist\ZoneMotionPC" "$env:RUNNER_TEMP\zone-native"
          exit $LASTEXITCODE
      - uses: actions/cache/save@v4
        if: always() && steps.inputs.outputs.cache-hit != 'true'
        with:
          key: zone-native-verified-inputs-2017-2-0f3-electron45-v1
          path: |
            ${{ runner.temp }}/zone-native/*.apk
            ${{ runner.temp }}/zone-native/*.exe
            ${{ runner.temp }}/zone-native/*.zip
      - name: Launch the actual Windows game and exercise menu and new game
        shell: powershell
        run: .\zone-motion-pc\native\test_candidate.ps1
      - name: Preserve startup diagnostics for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: powershell
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'dist\native-validation'
          if (-not (Test-Path -LiteralPath $folder)) { exit 0 }
          $archive = Join-Path $env:RUNNER_TEMP 'ZoneMotion-native-diagnostics.zip'
          Compress-Archive -Path "$folder\*" -DestinationPath $archive
          $tag = 'zone-motion-native-test-' + $env:RELEASE_COMMIT.Substring(0, 8)
          gh release create $tag $archive --target $env:RELEASE_COMMIT --prerelease --latest=false --title 'Zone Motion native startup diagnostics (not a game download)' --notes 'Automated native-player startup logs and screenshots. This is a compatibility probe, not a finished Windows game release.'
          exit $LASTEXITCODE
