<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Свои · подключение</title>
    <link rel="stylesheet" href="connect.css" />
    <script defer src="connect.js"></script>
  </head>
  <body>
    <main>
      <div class="logo">свои<span>✦</span></div>
      <span class="eyebrow">БЛИЖЕ, ДАЖЕ КОГДА ДАЛЕКО</span>
      <h1>Ваша компания.<br />Всегда рядом.</h1>
      <div id="connectionMark" class="connection-mark connecting">✦</div>
      <h2 id="statusTitle">Заходим к своим</h2>
      <p id="statusDescription" role="status" aria-live="polite">
        Ещё мгновение — и вы снова вместе.
      </p>
      <button id="retryButton" type="button" disabled>Подключаемся…</button>
      <footer>
        Свои подключаются автоматически.<br />Текст. Голос. Ваша компания.
      </footer>
    </main>
    <div class="decoration">✧</div>
  </body>
</html>
