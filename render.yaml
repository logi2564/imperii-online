services:
  - type: web
    name: svoi-chat
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: svoi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: BIND
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/svoi
      - key: COOKIE_SECURE
        value: "1"
